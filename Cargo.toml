[package]
name = "hni"
version = "0.0.3"
authors = ["Spark <helllo@kamran.sh>"]
categories = ["command-line-utilities", "development-tools"]
edition = "2024"
keywords = ["package-manager", "npm", "yarn", "pnpm", "cli"]
license = "GPL-3.0-only"
repository = "https://github.com/happytoolin/hni"
homepage = "https://github.com/happytoolin/hni"
description = "ni-compatible package manager command router with node shim"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
overflow-checks = false
debug = false
incremental = false

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

[dependencies]
anyhow = "1.0.102"
clap = { version = "4.6.0", default-features = false, features = ["std", "help", "usage", "error-context", "suggestions"] }
clap_complete = "4.6.0"
configparser = "3.1.0"
deno_task_shell = "0.29.0"
dialoguer = { version = "0.12.0", features = ["fuzzy-select"] }
dirs = "6.0.0"
indexmap = { version = "2.12.0", features = ["serde"] }
jsonc-parser = { version = "0.32.1", features = ["serde"] }
dunce = "1.0.5"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
shlex = "1.3.0"
tokio = { version = "1.50.0", features = ["rt"] }
strum = { version = "0.27.2", features = ["derive"] }
ureq = { version = "3.1.2", features = ["json"] }
urlencoding = "2.1.3"
which = "8.0.2"

[dev-dependencies]
tempfile = "3.27.0"
