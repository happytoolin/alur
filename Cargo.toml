[package]
name = "alur"
version = "0.0.4"
authors = ["Spark <helllo@kamran.sh>"]
categories = ["command-line-utilities", "development-tools"]
edition = "2024"
keywords = ["package-manager", "task-runner", "node-shim", "npm", "cli"]
license = "GPL-3.0-only"
repository = "https://github.com/happytoolin/alur"
homepage = "https://alur.happytoolin.com"
description = "Fast package-manager routing with short commands and an opt-in Node shim"
include = [
  "/Cargo.lock",
  "/Cargo.toml",
  "/LICENSE",
  "/README.md",
  "/aliases.json",
  "/src/**",
  "/tests/**",
]

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
overflow-checks = false
debug = false
incremental = false

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

[dependencies]
anyhow = "1.0.102"
clap = { version = "4.6.0", default-features = false, features = ["std", "help", "usage", "error-context", "suggestions", "derive"] }
clap_complete = "4.6.0"
deno_task_shell = "0.29.0"
dirs = "6.0.0"
indexmap = { version = "2.12.0", features = ["serde"] }
jsonc-parser = { version = "0.32.1", features = ["serde"] }
dunce = "1.0.5"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
shlex = "1.3.0"
tokio = { version = "1.50.0", features = ["rt"] }
strum = { version = "0.27.2", features = ["derive"] }
which = "8.0.2"
wildmatch = "2.6.1"
is_executable = "1.0.5"
thiserror = "2.0.18"
figment = { version = "0.10.19", features = ["toml", "env"] }
semver = "1.0.28"

[dev-dependencies]
tempfile = "3.27.0"
