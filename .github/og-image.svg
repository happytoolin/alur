<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">alur Open Graph Image</title>
  <desc id="desc">alur provides fast package manager routing across npm, yarn, pnpm, bun, and deno.</desc>

  <defs>
    <filter id="panelShadow" x="46" y="472" width="760" height="126" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#050604" flood-opacity="0.42"/>
    </filter>

    <style>
      .sans {
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      .mono {
        font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
      }
    </style>
  </defs>

  <rect width="1200" height="630" fill="#151614"/>
  <rect width="1200" height="630" fill="#E6D9C2" opacity="0.035"/>

  <g class="sans">
    <text x="82" y="197" fill="#F5ECD8" font-size="145" font-weight="880">alur</text>
    <text x="88" y="257" fill="#D9C7A9" font-size="38" font-weight="720">fast package manager routing</text>
    <text x="91" y="306" fill="#A79071" font-size="26" font-weight="650">one CLI for npm, yarn, pnpm, bun, and deno</text>
  </g>

  <g filter="url(#panelShadow)">
    <rect x="76" y="504" width="660" height="68" rx="17" fill="#0B0D0D"/>
  </g>
  <g class="mono">
    <text x="112" y="547" fill="#E9BD6D" font-size="27" font-weight="800">$</text>
    <text x="147" y="547" fill="#F7F0DF" font-size="27" font-weight="760">ni vite  -&gt;  pnpm add vite</text>
  </g>

  <g class="sans" fill="#EFDAB5" font-size="22" font-weight="720">
    <text x="760" y="502">install · run · exec · ci · shim</text>
    <text x="760" y="537" fill="#9D8A6E">same habit, right tool</text>
  </g>
</svg>
